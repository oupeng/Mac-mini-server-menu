build-server:
    name: Build Mac mini Server (Catalina x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build minimonitord (Target macOS 10.15)
        run: |
          cd Server
          # 针对 Mac mini 2012 (x86_64, macOS 10.15 Catalina) 编译
          swift build -c release --triple x86_64-apple-macosx10.15
          
          # 获取官方标准的二进制输出路径并拷贝
          BIN_PATH=$(swift build -c release --triple x86_64-apple-macosx10.15 --show-bin-path)
          mkdir -p ../dist/server
          cp "$BIN_PATH/minimonitord" ../dist/server/
          
          if [ -f "com.user.minimonitor.plist" ]; then
            cp com.user.minimonitor.plist ../dist/server/
          fi

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacMini-Server-Catalina
          path: dist/server/
