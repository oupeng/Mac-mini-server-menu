name: Manual Build MiniMonitor

on:
  workflow_dispatch:

jobs:
  build-server:
    name: Build Mac mini Server (Catalina x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Server App Bundle & Generate App Icon
        run: |
          cd Server
          swift build -c release --triple x86_64-apple-macosx10.15
          BIN_PATH=$(swift build -c release --triple x86_64-apple-macosx10.15 --show-bin-path)
          
          APP_BUNDLE="MiniServer.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          
          cp "$BIN_PATH/minimonitord" "$APP_BUNDLE/Contents/MacOS/MiniServer"
          
          if [ -f "Info.plist" ]; then
            cp Info.plist "$APP_BUNDLE/Contents/"
          fi

          # 核心：自动生成深邃科技感 Mac mini Server 专属 App 图标 (.icns)
          cat << 'EOF' > generate_icon.swift
          import Cocoa

          let size = NSSize(width: 1024, height: 1024)
          let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: 1024, pixelsHigh: 1024,
                                     bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true,
                                     isPlanar: false, colorSpaceName: .deviceRGB,
                                     bytesPerRow: 0, bitsPerPixel: 0)!
          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)

          // 1. 背景：极客深空灰蓝超质感圆角底板 (Squircle)
          let bgPath = NSBezierPath(roundedRect: NSRect(x: 100, y: 100, width: 824, height: 824), xRadius: 190, yRadius: 190)
          let gradient = NSGradient(colors: [
              NSColor(calibratedRed: 0.12, green: 0.14, blue: 0.20, alpha: 1.0),
              NSColor(calibratedRed: 0.05, green: 0.06, blue: 0.08, alpha: 1.0)
          ])!
          gradient.draw(in: bgPath, angle: -45)

          // 边缘高光
          bgPath.lineWidth = 6.0
          NSColor(white: 1.0, alpha: 0.15).setStroke()
          bgPath.stroke()

          // 2. 绘制主体：立体的铝合金 Mac mini 正面剪影
          let miniRect = NSRect(x: 232, y: 390, width: 560, height: 210)
          let miniPath = NSBezierPath(roundedRect: miniRect, xRadius: 46, yRadius: 46)
          let alumGradient = NSGradient(colors: [
              NSColor(calibratedRed: 0.88, green: 0.90, blue: 0.92, alpha: 1.0),
              NSColor(calibratedRed: 0.65, green: 0.68, blue: 0.72, alpha: 1.0)
          ])!
          alumGradient.draw(in: miniPath, angle: -90)
          
          miniPath.lineWidth = 4.0
          NSColor(white: 1.0, alpha: 0.6).setStroke()
          miniPath.stroke()

          // 3. 左侧红外感应口 (黑色圆润矩形)
          let irRect = NSRect(x: 310, y: 475, width: 60, height: 40)
          let irPath = NSBezierPath(roundedRect: irRect, xRadius: 10, yRadius: 10)
          NSColor(calibratedRed: 0.1, green: 0.1, blue: 0.12, alpha: 0.9).setFill()
          irPath.fill()

          // 4. 右侧常亮白色激光电源指示灯 (带极客青色光晕)
          let glowPath = NSBezierPath(ovalIn: NSRect(x: 650, y: 460, width: 70, height: 70))
          NSColor(calibratedRed: 0.0, green: 0.9, blue: 0.8, alpha: 0.3).setFill()
          glowPath.fill()

          let ledPath = NSBezierPath(ovalIn: NSRect(x: 667, y: 477, width: 36, height: 36))
          NSColor(white: 1.0, alpha: 1.0).setFill()
          ledPath.fill()

          NSGraphicsContext.restoreGraphicsState()
          let data = rep.representation(using: .png, properties: [:])!
          try! data.write(to: URL(fileURLWithPath: "icon_1024.png"))
          EOF
          
          swift generate_icon.swift
          
          # 打包为符合 macOS 标准的 icns 图标文件
          mkdir -p icon.iconset
          sips -z 16 16     icon_1024.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon_1024.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon_1024.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon_1024.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon_1024.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon_1024.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon_1024.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon_1024.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon_1024.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 icon_1024.png --out icon.iconset/icon_512x512@2x.png
          
          iconutil -c icns icon.iconset -o "$APP_BUNDLE/Contents/Resources/MiniServer.icns"
          rm -rf icon.iconset icon_1024.png generate_icon.swift
          
          # 代码签名
          codesign --force --deep --sign - "$APP_BUNDLE"
          
          mkdir -p ../dist/server
          cp -R "$APP_BUNDLE" ../dist/server/

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacMini-Server-App
          path: dist/server/

  build-client:
    name: Build MacBook Pro Client (macOS 26 x86_64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build MiniBar.app with Adaptive Icons
        run: |
          cd Client
          swift build -c release --arch x86_64
          BIN_PATH=$(swift build -c release --arch x86_64 --show-bin-path)
          
          APP_BUNDLE="MiniBar.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS"
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          
          cp "$BIN_PATH/MiniBar" "$APP_BUNDLE/Contents/MacOS/"
          
          if [ -f "MiniBar/Info.plist" ]; then
            cp MiniBar/Info.plist "$APP_BUNDLE/Contents/"
          fi
          cd ..

          if [ -f "Light.icns" ] && [ -f "Dark.icns" ]; then
            TMP_ASSETS=$(mktemp -d)/Assets.xcassets
            ICONSET="$TMP_ASSETS/AppIcon.appiconset"
            mkdir -p "$ICONSET"

            sips -s format png Light.icns --resampleWidth 1024 --out "$ICONSET/icon_light.png"
            sips -s format png Dark.icns --resampleWidth 1024 --out "$ICONSET/icon_dark.png"

            cat << 'EOF' > "$ICONSET/Contents.json"
            {
              "images" : [
                {
                  "idiom" : "mac",
                  "size" : "1024x1024",
                  "scale" : "1x",
                  "filename" : "icon_light.png"
                },
                {
                  "appearances" : [
                    {
                      "appearance" : "luminosity",
                      "value" : "dark"
                    }
                  ],
                  "idiom" : "mac",
                  "size" : "1024x1024",
                  "scale" : "1x",
                  "filename" : "icon_dark.png"
                }
              ],
              "info" : {
                "author" : "xcode",
                "version" : 1
              }
            }
          EOF

            xcrun actool "$TMP_ASSETS" \
              --compile "Client/$APP_BUNDLE/Contents/Resources" \
              --platform macosx \
              --minimum-deployment-target 14.0 \
              --app-icon AppIcon \
              --output-partial-info-plist /tmp/partial.plist

            cp Light.icns "Client/$APP_BUNDLE/Contents/Resources/AppIcon.icns"
          fi
          
          codesign --force --deep --sign - "Client/$APP_BUNDLE"
          
          mkdir -p dist/client
          cp -R "Client/$APP_BUNDLE" dist/client/

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacBook-MiniBar-Client
          path: dist/client/
